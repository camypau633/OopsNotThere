<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17152b">
  <meta name="description" content="ОЙ, НЕ ТУДА! — маленькая головоломка, в которой правила постоянно меняются.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>ОЙ, НЕ ТУДА!</title>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <span class="logo">ОЙ, НЕ ТУДА!</span>
      <span id="level-label">Уровень 1</span>
    </header>
    <section id="game-wrap" aria-label="Игровая область">
      <div id="game"></div>
    </section>
    <footer>Маленькая игра с большими сюрпризами</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
